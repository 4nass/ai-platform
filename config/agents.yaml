# Ordered execution profiles for every role.
#
# The first profile clearing quota and failure gates runs; the second is a
# fallback, not a second opinion. The base list is the "complex" policy.
# profiles_by_complexity overrides it for bounded classifications emitted by
# the decomposer: routine, complex, or critical. Models are never invented by
# an agent.
#
# `effort` is provider-neutral configuration. The adapters translate it to
# Codex's model_reasoning_effort or Claude Code's --effort. Legacy
# reasoning_effort/provider/providers entries remain accepted by the loader.

decomposer:
  profiles:
    - {provider: codex_cli, model: gpt-5.6-terra, effort: low}
    - {provider: claude_code, model: claude-sonnet-5, effort: medium}

architect:
  profiles:
    - {provider: claude_code, model: claude-opus-5, effort: xhigh}
    - {provider: codex_cli, model: gpt-5.6-sol, effort: high}
  profiles_by_complexity:
    routine:
      - {provider: claude_code, model: claude-sonnet-5, effort: high}
      - {provider: codex_cli, model: gpt-5.6-terra, effort: medium}
    critical:
      - {provider: claude_code, model: claude-opus-5, effort: ultracode}
      - {provider: codex_cli, model: gpt-5.6-sol, effort: xhigh}

backend:
