# Which execution profiles may serve each role, in order of preference.
#
# The list declares *eligibility*, which the engine cannot derive: anthropic_api
# has no disk access, and a role's contract may rule a provider out entirely.
# The router (core/orchestrator/router.py) walks this order and takes the first
# candidate that clears its quota and failure gates — your order governs, and it
# only overrides on measurable grounds.
#
# Profiles may pin a model and reasoning effort. Bare `providers: [X]` and
# legacy `provider: X` entries remain supported.

decomposer:
  profiles:
    - {provider: codex_cli, model: gpt-5.6-terra, reasoning_effort: low}
    - {provider: claude_code}

architect:
  providers: [claude_code]

backend:
  providers: [claude_code]

frontend:
  providers: [claude_code]

reviewer:
  profiles:
    - {provider: codex_cli, model: gpt-5.6-sol, reasoning_effort: medium}
    - {provider: claude_code}

security:
  profiles:
    - {provider: claude_code}
    - {provider: codex_cli, model: gpt-5.6-sol, reasoning_effort: high}

tests:
  providers: [codex_cli, claude_code]

documentation:
  providers: [claude_code]

corrector:
  providers: [codex_cli, claude_code]
