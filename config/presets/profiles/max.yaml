# Mechanically derived from balanced.yaml: every role's existing "critical"
# tier -- already the most capable profile declared for that role -- becomes
# the unconditional base policy. No new tuning, no invented values; this is a
# reshuffle of profiles.yaml's own numbers, not a new calibration.
#
# decomposer has no complexity tiers in balanced.yaml (one policy regardless
# of complexity), so it is carried over unchanged -- there is nothing to
# promote.
#
# No profiles_by_complexity here: the base *is* the max policy at every
# complexity class, so there is nothing for a complexity override to raise it
# to.

decomposer:
  profiles:
    - {provider: codex_cli, model: gpt-5.6-terra, effort: low}
    - {provider: claude_code, model: claude-sonnet-5, effort: medium}

architect:
  profiles:
    - {provider: codex_cli, model: gpt-5.6-sol, effort: xhigh}
    - {provider: claude_code, model: claude-opus-5, effort: high}

