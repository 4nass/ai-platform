# Subscription budgets, declared — not discovered.
#
# Neither CLI reports how much allowance is left: `codex exec --json` emits
# only thread/turn/item events, and `claude -p --output-format json` carries a
# per-call price but no remaining balance. So the engine derives pressure from
# what it has actually recorded (core.telemetry.store.provider_pressure) and
# measures it against the limits declared here.
#
# These numbers are the subscriber's own plan limits. Getting them wrong makes
# the pressure figure wrong and nothing else — no run is blocked by this file.
# Leave a provider out to report its consumption without a percentage.
#
# window_hours: the rolling window the budget applies to.
# tokens: total prompt + completion tokens allowed in that window.

providers:
  claude_code:
    window_hours: 5
    tokens: 8000000
  codex_cli:
    window_hours: 5
    tokens: 8000000
