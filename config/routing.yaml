# When the router may override the preference order in config/agents.yaml.
#
# Your order governs. The router only skips a candidate on grounds it can
# measure — never on a marginal quality judgement, because the sample sizes
# here cannot support one.
#
# Recorded in each run's telemetry metadata: comparing two runs' routing means
# nothing without the thresholds they were judged against.

# Skip a provider whose consumption in the window has passed this share of the
# budget declared in config/quota.yaml. This is the whole point of reasoning in
# quota rather than dollars.
max_quota_ratio: 0.85

# Skip a provider whose success rate for *this role* has fallen below this...
min_success_rate: 0.6

# ...but only once there are this many calls to say so. The sample size gates
# the rule rather than decorating it: 0.5 over 2 calls and 0.5 over 200 are not
# the same claim, and a router that cannot tell them apart chases noise.
min_samples: 5

# Rolling window for both the quota and success-rate figures.
window_hours: 24
