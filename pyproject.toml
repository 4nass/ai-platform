[project]
name = "ai-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.115.0",
    "gitpython>=3.1.57",
    "langchain>=1.3.14",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.23.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
ai-platform = "ai_platform:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
